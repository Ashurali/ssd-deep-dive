# SSD Deep Dive — MkDocs configuration (see SITE_SPECIFICATION.md)
site_name: SSD Deep Dive
site_description: >-
  A standalone, bilingual (EN/中文) interactive textbook on solid-state
  storage — controllers, NAND flash, FTL, PCIe, NVMe, testing — with 13
  live animations. Grew out of the《深入淺出SSD》study corpus.
site_url: https://ashurali.github.io/ssd-deep-dive/

# Broken section anchors (glossary/formulas/quiz links) fail the strict build
validation:
  links:
    anchors: warn

# rebuild on edits to the acronym list (it lives outside docs/) and the hooks
watch:
  - includes
  - hooks
  - scripts/build_glossary.py

# Build-time steps that live in this repo (see each file's docstring)
hooks:
  - hooks/acronym_links.py # every acronym links to its glossary entry
  - hooks/inline_svg.py # figures inlined so they follow the light/dark theme
  - hooks/reading_time.py # "≈ N min read" under each chapter title

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # Three-state toggle: system (default) → light → dark → system. "System"
  # keeps following the OS on every visit; light/dark are manual overrides.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to system preference
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer # prev/next links at the bottom of every page
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tooltips # styled tooltips for the acronym <abbr>s below

plugins:
  - search:
      lang:
        - en
        - zh
      # jieba segments CJK with zero-width spaces (U+200B) at build time;
      # the client must split tokens on them for 垃圾回收-style queries
      separator: '[\s​\-]+'
  - tags
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - abbr
  # Every page gets the site-wide acronym list appended, so each acronym shows
  # its expansion on hover/tap. The list lives outside docs/ (it is not a page).
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
      check_paths: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.blocks.caption # "/// figure-caption" → numbered <figure> captions
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  # KaTeX. Inline math is \( ... \) only — single-$ is disabled because the
  # guides use "$" for prices ("$370M") throughout.
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: ['round']
      block_syntax: ['square', 'dollar']

extra_css:
  - https://unpkg.com/katex@0.16.11/dist/katex.min.css
  - assets/extra.css

extra_javascript:
  - assets/javascripts/katex.js
  - assets/javascripts/iframe-resize.js
  - assets/javascripts/acronyms.js
  - https://unpkg.com/katex@0.16.11/dist/katex.min.js
  - https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js

nav:
  - Home: index.md
  - Core Chapters:
      - core/ch0-foundations.md
      - core/ch1-overview.md
      - core/ch2-controllers-afa.md
      - core/ch3-nand-flash.md
      - core/ch4-ftl.md
      - core/ch5-pcie.md
      - core/ch6-nvme.md
      - core/ch7-testing.md
  - Supplements:
      - supplements/a-ecc-coding-theory.md
      - supplements/b-ufs.md
      - supplements/c-flash-file-systems.md
      - supplements/d-power-management.md
      - supplements/e-aerospace-storage.md
      - supplements/f-security.md
      - supplements/g-firmware.md
  - Animations:
      - animations/index.md
      - animations/vt-playground.md
      - animations/toy-ssd-sandbox.md
      - animations/nvme-ring-machine.md
      - animations/packet-dresser.md
      - animations/flash-timing-lab.md
      - animations/mapping-paths.md
      - animations/power-loss-rebuild.md
      - animations/stripe-raid.md
      - animations/enum-routing.md
      - animations/ssd-calculators.md
      - animations/nand-flash-animation.md
      - animations/ecc-bit-correction.md
      - animations/ecc-bch-ldpc.md
  - Reference:
      - reference/glossary.md
      - reference/formulas.md
      - reference/quizzes.md
      - reference/specs.md
      - reference/tags.md
      # production notes on how the animations were planned, not a reading page
      - atlas/figure-atlas-animation-roadmap.md
