<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 244" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>Where the map lives sets the cost of a random read</title>
<desc>Three timelines for one random 4 KB read. With DRAM: a near-instant map lookup in the drive's DRAM, then one flash read. DRAM-less with a map-cache miss: the map entry must itself be read from flash first, so the read takes two flash reads, about twice as long. With HMB: the map lives in host memory, so the lookup is a short trip over PCIe, then one flash read.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-ink" d="M0,0 L8,4 L0,8 z" fill="#e8eeff"/></marker></defs>
<text class="f-ink" x="16" y="20" font-weight="700" fill="#e8eeff">With DRAM</text>
<text class="f-mute" x="384" y="20" text-anchor="end" fill="#a3abc4">map lookup in local DRAM</text>
<rect class="f-amber" x="16" y="30" width="6" height="28" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<rect class="f-cyan" x="22" y="30" width="178" height="28" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="111" y="49" text-anchor="middle" fill="#e8eeff">read the data</text>
<text class="f-ink" x="16" y="92" font-weight="700" fill="#e8eeff">DRAM-less, map-cache miss</text>
<rect class="f-amber" x="16" y="102" width="178" height="28" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<rect class="f-cyan" x="194" y="102" width="178" height="28" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="105" y="121" text-anchor="middle" fill="#e8eeff">read the map</text>
<text class="f-ink" x="283" y="121" text-anchor="middle" fill="#e8eeff">read the data</text>
<text class="f-ink" x="16" y="164" font-weight="700" fill="#e8eeff">HMB</text>
<text class="f-mute" x="384" y="164" text-anchor="end" fill="#a3abc4">map in host memory, over PCIe</text>
<rect class="f-amber" x="16" y="174" width="18" height="28" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<rect class="f-cyan" x="34" y="174" width="178" height="28" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="123" y="193" text-anchor="middle" fill="#e8eeff">read the data</text>
<rect class="f-amber" x="16" y="221" width="14" height="12" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<text class="f-mute" x="36" y="232" fill="#a3abc4">map lookup</text>
<rect class="f-cyan" x="128" y="221" width="14" height="12" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-mute" x="148" y="232" fill="#a3abc4">flash read</text>
<line class="f-line" x1="250" y1="227" x2="374" y2="227" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="f-mute" x="246" y="232" text-anchor="end" fill="#a3abc4">time</text>
</svg>
