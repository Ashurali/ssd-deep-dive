<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>Write amplification falls as over-provisioning grows</title>
<desc>A chart of write amplification (WA, vertical, 1 to 12) against over-provisioning (OP, horizontal, 0 to 100 percent). Two curves fall steeply at small OP and flatten toward 1 as OP grows. The upper curve assumes garbage is spread evenly over every block, the chapter's worst case: WA = (1 + OP) / OP, which passes through WA 6 at 20 percent OP and WA 3 at 50 percent. The lower curve is a model of uniform random writes with the oldest block cleaned first; it sits well below the worst case, and greedy victim selection does better still.</desc>
