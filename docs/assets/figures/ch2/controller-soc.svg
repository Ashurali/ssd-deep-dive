<text class="f-ink" x="32" y="317" fill="#e8eeff">ECC engine (LDPC)</text>
<text class="f-ink" x="32" y="336" fill="#e8eeff">flash controller</text>
<rect class="f-line f-panel" x="206" y="278" width="80" height="68" rx="8" fill="#111832" stroke="#7d86a3"/>
<text class="f-ink" x="246" y="306" text-anchor="middle" font-weight="700" fill="#e8eeff">SRAM</text>
<text class="f-ink" x="246" y="325" text-anchor="middle" fill="#e8eeff">buffers</text>
<rect class="f-amber" x="298" y="278" width="86" height="68" rx="8" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<text class="f-ink" x="341" y="306" text-anchor="middle" font-weight="700" fill="#e8eeff">DRAM</text>
<text class="f-ink" x="341" y="325" text-anchor="middle" fill="#e8eeff">controller</text>
<path class="f-line" d="M58,346 V398 M90,346 V398 M122,346 V398 M154,346 V398" fill="none" stroke="#7d86a3" stroke-width="1.5"/>
<text class="f-mute" x="164" y="382" fill="#a3abc4">channels</text>
<rect class="f-violet" x="20" y="398" width="172" height="48" rx="6" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<text class="f-ink" x="106" y="418" text-anchor="middle" font-weight="700" fill="#e8eeff">NAND flash</text>
<text class="f-ink" x="106" y="437" text-anchor="middle" fill="#e8eeff">many dies</text>
<line class="f-line" x1="341" y1="346" x2="341" y2="398" stroke="#7d86a3" stroke-width="1.5"/>
<text class="f-mute" x="349" y="380" fill="#a3abc4">DDR</text>
<rect class="f-amber" x="298" y="398" width="86" height="48" rx="6" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<text class="f-ink" x="341" y="418" text-anchor="middle" font-weight="700" fill="#e8eeff">DRAM</text>
<text class="f-ink" x="341" y="437" text-anchor="middle" fill="#e8eeff">map table</text>
</svg>
