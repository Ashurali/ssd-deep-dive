<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 404" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>Channels and dies working in parallel</title>
<desc>Two panels. Top: a flash controller drives four channels. Each channel is one shared bus with four dies attached. On every channel one die is on the bus, selected by its chip-enable line, two dies are busy programming and one is idle, so twelve operations are under way across the drive at once. Bottom: one channel over time. The bus sends a page to die 0, then to die 1, die 2 and die 3, back to back. Each die then programs for five times as long as its transfer took, while the bus serves the others. After the fourth transfer the bus sits idle until die 0 finishes, and then the second round begins.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-ink" d="M0,0 L8,4 L0,8 z" fill="#e8eeff"/></marker></defs>
<text class="f-ink" x="16" y="20" font-weight="700" fill="#e8eeff">Four channels, four dies each</text>
<rect class="f-cyan" x="16" y="30" width="368" height="34" rx="6" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
