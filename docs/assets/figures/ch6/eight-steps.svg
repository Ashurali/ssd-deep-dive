<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 392" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>The eight steps of an NVMe command</title>
<desc>A sequence chart between the host (driver and memory) on the left and the SSD controller on the right. 1, the host writes the command into its submission queue. 2, the host rings the SQ Tail doorbell on the SSD. 3, the SSD fetches the command from host memory. 4, the SSD executes it. 5, the SSD writes a completion entry into the completion queue in host memory. 6, the SSD sends an MSI-X interrupt. 7, the host processes the completion. 8, the host rings the CQ Head doorbell.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-ink" d="M0,0 L8,4 L0,8 z" fill="#e8eeff"/></marker></defs>
<rect class="f-cyan" x="16" y="8" width="148" height="30" rx="6" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="90" y="28" text-anchor="middle" font-weight="700" fill="#e8eeff">Host</text>
<rect class="f-violet" x="236" y="8" width="148" height="30" rx="6" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<text class="f-ink" x="310" y="28" text-anchor="middle" font-weight="700" fill="#e8eeff">SSD controller</text>
<line class="f-line f-dash" x1="90" y1="38" x2="90" y2="384" stroke="#7d86a3" stroke-dasharray="4 3"/>
<line class="f-line f-dash" x1="310" y1="38" x2="310" y2="384" stroke="#7d86a3" stroke-dasharray="4 3"/>
<rect class="f-line f-panel" x="16" y="52" width="148" height="28" rx="6" fill="#111832" stroke="#7d86a3"/>
<text class="f-ink" x="90" y="71" text-anchor="middle" fill="#e8eeff">1 · command into SQ</text>
<text class="f-ink" x="200" y="104" text-anchor="middle" fill="#e8eeff">2 · ring SQ Tail doorbell</text>
<line class="f-line" x1="90" y1="112" x2="307" y2="112" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="f-ink" x="200" y="144" text-anchor="middle" fill="#e8eeff">3 · fetch the command</text>
<line class="f-line" x1="310" y1="152" x2="93" y2="152" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="f-line f-panel" x="236" y="168" width="148" height="28" rx="6" fill="#111832" stroke="#7d86a3"/>
<text class="f-ink" x="310" y="187" text-anchor="middle" fill="#e8eeff">4 · execute it</text>
<text class="f-ink" x="200" y="222" text-anchor="middle" fill="#e8eeff">5 · completion into CQ</text>
<line class="f-line" x1="310" y1="230" x2="93" y2="230" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="f-ink" x="200" y="262" text-anchor="middle" fill="#e8eeff">6 · interrupt (MSI-X)</text>
<line class="f-line" x1="310" y1="270" x2="93" y2="270" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="f-line f-panel" x="16" y="286" width="148" height="28" rx="6" fill="#111832" stroke="#7d86a3"/>
<text class="f-ink" x="90" y="305" text-anchor="middle" fill="#e8eeff">7 · process it</text>
<text class="f-ink" x="200" y="340" text-anchor="middle" fill="#e8eeff">8 · ring CQ Head doorbell</text>
<line class="f-line" x1="90" y1="348" x2="307" y2="348" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="f-mute" x="200" y="380" text-anchor="middle" fill="#a3abc4">SQ and CQ live in host memory; doorbells on the SSD</text>
</svg>
