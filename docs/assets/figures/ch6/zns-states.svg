<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>The states of a ZNS zone</title>
<desc>A state diagram. An Empty zone becomes Opened when written. An Opened zone can be Closed, which frees its open-zone resources, and a write reopens it. When a zone fills, or the host finishes it, it becomes Full. A reset erases the zone and returns it to Empty. Zones that are failing go Read Only or Offline.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-ink" d="M0,0 L8,4 L0,8 z" fill="#e8eeff"/></marker></defs>
<rect class="f-line f-panel" x="140" y="20" width="120" height="34" rx="17" fill="#111832" stroke="#7d86a3"/>
<text class="f-ink" x="200" y="42" text-anchor="middle" font-weight="700" fill="#e8eeff">Empty</text>
<rect class="f-cyan" x="24" y="120" width="128" height="34" rx="17" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="88" y="142" text-anchor="middle" font-weight="700" fill="#e8eeff">Opened</text>
<rect class="f-amber" x="248" y="120" width="128" height="34" rx="17" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<text class="f-ink" x="312" y="142" text-anchor="middle" font-weight="700" fill="#e8eeff">Closed</text>
<rect class="f-violet" x="140" y="220" width="120" height="34" rx="17" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<text class="f-ink" x="200" y="242" text-anchor="middle" font-weight="700" fill="#e8eeff">Full</text>
<line class="f-line" x1="160" y1="54" x2="104" y2="117" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="f-mute" x="96" y="84" fill="#a3abc4">write</text>
<line class="f-line" x1="152" y1="131" x2="245" y2="131" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="f-mute" x="200" y="124" text-anchor="middle" fill="#a3abc4">close</text>
<line class="f-line" x1="248" y1="146" x2="155" y2="146" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="f-mute" x="200" y="168" text-anchor="middle" fill="#a3abc4">write</text>
<line class="f-line" x1="100" y1="154" x2="160" y2="217" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="f-mute" x="24" y="196" fill="#a3abc4">fills up or</text>
<text class="f-mute" x="24" y="213" fill="#a3abc4">finish</text>
<line class="f-line" x1="300" y1="154" x2="240" y2="217" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="f-mute" x="300" y="200" fill="#a3abc4">finish</text>
<path class="f-green-l" d="M260,237 H388 V37 H263" fill="none" stroke="#7ee2a8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="f-green-t" x="324" y="30" text-anchor="middle" fill="#7ee2a8">reset (erase)</text>
<line class="f-faint" x1="16" y1="276" x2="384" y2="276" stroke="#2a3150"/>
<text class="f-mute" x="16" y="298" fill="#a3abc4">failing zones:</text>
<rect class="f-red f-dash" x="120" y="284" width="120" height="28" rx="14" fill="#ff7b72" fill-opacity=".22" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="f-ink" x="180" y="303" text-anchor="middle" fill="#e8eeff">Read Only</text>
<rect class="f-red f-dash" x="256" y="284" width="120" height="28" rx="14" fill="#ff7b72" fill-opacity=".22" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="f-ink" x="316" y="303" text-anchor="middle" fill="#e8eeff">Offline</text>
<text class="f-mute" x="16" y="336" fill="#a3abc4">open zones hold buffers, so drives cap how many</text>
</svg>
