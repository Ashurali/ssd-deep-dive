<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>The fields of a TLP header</title>
<desc>The first 32-bit doubleword of a TLP header, drawn as two rows of 16 bits. Top row: Fmt (3 bits), Type (5 bits), a reserved bit, TC (3 bits) and four other bits. Bottom row: TD (1 bit), EP (1 bit), Attr (2 bits), AT (2 bits) and Length (10 bits). Notes explain each field. Below, the second doubleword carries the requester ID, a tag and byte enables, and the third (and, for 64-bit addresses, fourth) carries the address.</desc>
<text class="f-ink" x="16" y="20" font-weight="700" fill="#e8eeff">DW0, the first 4 bytes of every header</text>
<rect class="f-cyan" x="16" y="30" width="69" height="28" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<rect class="f-cyan" x="85" y="30" width="115" height="28" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<rect class="f-line f-panel" x="200" y="30" width="23" height="28" fill="#111832" stroke="#7d86a3"/>
<rect class="f-amber" x="223" y="30" width="69" height="28" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<rect class="f-line f-panel" x="292" y="30" width="92" height="28" fill="#111832" stroke="#7d86a3"/>
<text class="f-ink" x="50.5" y="49" text-anchor="middle" fill="#e8eeff">Fmt</text>
<text class="f-ink" x="142.5" y="49" text-anchor="middle" fill="#e8eeff">Type</text>
<text class="f-ink" x="257.5" y="49" text-anchor="middle" fill="#e8eeff">TC</text>
<text class="f-mute" x="338" y="49" text-anchor="middle" fill="#a3abc4">other</text>
<rect class="f-violet" x="16" y="62" width="23" height="28" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<rect class="f-violet" x="39" y="62" width="23" height="28" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<rect class="f-line f-panel" x="62" y="62" width="46" height="28" fill="#111832" stroke="#7d86a3"/>
<rect class="f-line f-panel" x="108" y="62" width="46" height="28" fill="#111832" stroke="#7d86a3"/>
<rect class="f-green" x="154" y="62" width="230" height="28" fill="#7ee2a8" fill-opacity=".22" stroke="#7ee2a8" stroke-width="1.5"/>
<text class="f-ink" x="27.5" y="81" text-anchor="middle" fill="#e8eeff">TD</text>
<text class="f-ink" x="50.5" y="81" text-anchor="middle" fill="#e8eeff">EP</text>
<text class="f-mute" x="85" y="81" text-anchor="middle" fill="#a3abc4">Attr</text>
<text class="f-mute" x="131" y="81" text-anchor="middle" fill="#a3abc4">AT</text>
<text class="f-ink" x="269" y="81" text-anchor="middle" fill="#e8eeff">Length (10 bits)</text>
<text class="f-cyan-t" x="16" y="116" fill="#4dd0c4">Fmt: with or without data; 3DW or 4DW header</text>
<text class="f-cyan-t" x="16" y="134" fill="#4dd0c4">Type: MRd, MWr, CfgRd, CfgWr, Msg, Cpl…</text>
<text class="f-amber-t" x="16" y="152" fill="#f2b13c">TC: traffic class, priority 0–7 (QoS)</text>
<text class="f-violet-t" x="16" y="170" fill="#a78bfa">TD: ECRC present · EP: data poisoned</text>
<text class="f-green-t" x="16" y="188" fill="#7ee2a8">Length: payload in DW; 1,024 DW = 4 KB max</text>
<rect class="f-line f-panel" x="16" y="204" width="368" height="30" rx="4" fill="#111832" stroke="#7d86a3"/>
<text class="f-ink" x="28" y="224" fill="#e8eeff">DW1 · Requester ID (BDF) · Tag · byte enables</text>
<rect class="f-line f-panel" x="16" y="240" width="368" height="30" rx="4" fill="#111832" stroke="#7d86a3"/>
<text class="f-ink" x="28" y="260" fill="#e8eeff">DW2–DW3 · address: 32-bit, or 64-bit in 4DW</text>
<text class="f-mute" x="384" y="286" text-anchor="end" fill="#a3abc4">memory-request layout shown</text>
</svg>
