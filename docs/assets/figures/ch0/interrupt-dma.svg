<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>One read with DMA and an interrupt</title>
<desc>A sequence diagram with three participants: the CPU, DRAM and the SSD. Step 1: the CPU sends the SSD a command saying what to read and which DRAM buffer to fill. Step 2: the SSD copies the data straight into that DRAM buffer by DMA, without the CPU. Step 3: the SSD interrupts the CPU to say the command is done. Step 4: the CPU reads the data from DRAM.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-ink" d="M0,0 L8,4 L0,8 z" fill="#e8eeff"/></marker></defs>
<rect class="f-violet" x="16" y="8" width="108" height="32" rx="6" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<rect class="f-cyan" x="146" y="8" width="108" height="32" rx="6" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<rect class="f-amber" x="276" y="8" width="108" height="32" rx="6" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<g class="f-ink" fill="#e8eeff" font-weight="700" text-anchor="middle">
<text x="70" y="29">CPU</text>
<text x="200" y="29">DRAM</text>
<text x="330" y="29">SSD</text>
</g>
<g class="f-line f-dash" stroke="#7d86a3" stroke-width="1.2" stroke-dasharray="4 3">
<line x1="70" y1="40" x2="70" y2="212"/>
<line x1="200" y1="40" x2="200" y2="212"/>
<line x1="330" y1="40" x2="330" y2="212"/>
</g>
<g class="f-line" stroke="#7d86a3" stroke-width="1.5">
<line x1="70" y1="72" x2="330" y2="72" marker-end="url(#arrow)"/>
<line x1="330" y1="112" x2="200" y2="112" marker-end="url(#arrow)"/>
<line x1="330" y1="152" x2="70" y2="152" marker-end="url(#arrow)"/>
<line x1="70" y1="192" x2="200" y2="192" marker-end="url(#arrow)"/>
</g>
<g class="f-ink" fill="#e8eeff">
<text x="80" y="64">1. command</text>
<text x="210" y="104">2. DMA: the data</text>
<text x="210" y="144">3. interrupt: done</text>
<text x="80" y="184">4. read the data</text>
</g>
</svg>
