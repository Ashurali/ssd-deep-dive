<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 192" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>A ring buffer with head and tail</title>
<desc>Eight fixed slots in a row of memory. Slots 2 to 5 hold commands waiting to be taken. The head points at slot 2, the next entry the consumer will take; the tail points at slot 6, the next free slot the producer will fill. An arrow from the end of the last slot back to the first shows that both pointers wrap around.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-ink" d="M0,0 L8,4 L0,8 z" fill="#e8eeff"/></marker></defs>
<text class="f-mute" x="16" y="16" fill="#a3abc4">an eight-entry ring in memory</text>
<text class="f-ink" x="131" y="38" text-anchor="middle" fill="#e8eeff">head · next to take</text>
<line class="f-line" x1="131" y1="44" x2="131" y2="62" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="f-line" fill="none" stroke="#7d86a3" stroke-width="1.2">
<rect x="16" y="64" width="46" height="36"/>
<rect x="62" y="64" width="46" height="36"/>
<rect x="292" y="64" width="46" height="36"/>
<rect x="338" y="64" width="46" height="36"/>
</g>
<g class="f-cyan" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5">
<rect x="108" y="64" width="46" height="36"/>
<rect x="154" y="64" width="46" height="36"/>
<rect x="200" y="64" width="46" height="36"/>
<rect x="246" y="64" width="46" height="36"/>
</g>
<g class="f-ink" fill="#e8eeff" text-anchor="middle">
<text x="131" y="87">cmd</text>
<text x="177" y="87">cmd</text>
<text x="223" y="87">cmd</text>
<text x="269" y="87">cmd</text>
</g>
<line class="f-line" x1="315" y1="126" x2="315" y2="102" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="f-ink" x="315" y="142" text-anchor="middle" fill="#e8eeff">tail · next free</text>
<path class="f-line f-dash" d="M384,82 H392 V164 H8 V82 H14" fill="none" stroke="#7d86a3" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="f-mute" x="200" y="184" text-anchor="middle" fill="#a3abc4">after the last slot, wrap to the first</text>
</svg>
