<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 436" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>Inside an SSD: front end, FTL and back end</title>
<desc>A block diagram. The host (operating system and driver) exchanges commands, data and status with the controller chip. Inside the controller, the front end speaks the host protocol (SATA, SAS or PCIe/NVMe). The FTL firmware, running on CPU cores, handles mapping, garbage collection, wear leveling and bad blocks, keeping its map table and buffers in the DRAM beside it. The back end applies ECC and drives the flash interface (ONFI or Toggle). Four channels fan out from the back end, each with two NAND flash dies. A power-regulation block feeds the whole drive.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-ink" d="M0,0 L8,4 L0,8 z" fill="#e8eeff"/></marker></defs>
<rect class="f-line f-panel" x="16" y="10" width="92" height="36" rx="6" fill="#111832" stroke="#7d86a3"/>
<text class="f-mute" x="62" y="33" text-anchor="middle" fill="#a3abc4">power</text>
<rect class="f-line f-panel" x="140" y="10" width="200" height="36" rx="6" fill="#111832" stroke="#7d86a3"/>
<text class="f-ink" x="240" y="33" text-anchor="middle" fill="#e8eeff">Host · OS and driver</text>
<line class="f-line" x1="240" y1="48" x2="240" y2="77" stroke="#7d86a3" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="f-mute" x="230" y="67" text-anchor="end" fill="#a3abc4">commands, data, status</text>
<line class="f-line f-dash" x1="62" y1="46" x2="62" y2="80" stroke="#7d86a3" stroke-dasharray="4 3"/>
<rect class="f-line" x="16" y="80" width="368" height="232" rx="12" fill="none" stroke="#7d86a3"/>
<text class="f-mute" x="370" y="100" text-anchor="end" fill="#a3abc4">controller (one chip)</text>
<rect class="f-cyan" x="32" y="110" width="336" height="46" rx="8" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="44" y="130" font-weight="700" fill="#e8eeff">Front end</text>
<text class="f-ink" x="44" y="148" fill="#e8eeff">host protocol: SATA · SAS · PCIe/NVMe</text>
<rect class="f-green" x="32" y="166" width="236" height="78" rx="8" fill="#7ee2a8" fill-opacity=".22" stroke="#7ee2a8" stroke-width="1.5"/>
<text class="f-ink" x="44" y="186" font-weight="700" fill="#e8eeff">FTL · firmware on CPU cores</text>
<text class="f-ink" x="44" y="206" fill="#e8eeff">mapping · garbage collection</text>
<text class="f-ink" x="44" y="226" fill="#e8eeff">wear leveling · bad blocks</text>
<rect class="f-amber" x="278" y="166" width="90" height="78" rx="8" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<text class="f-ink" x="323" y="190" text-anchor="middle" font-weight="700" fill="#e8eeff">DRAM</text>
<text class="f-ink" x="323" y="210" text-anchor="middle" fill="#e8eeff">map table</text>
<text class="f-ink" x="323" y="228" text-anchor="middle" fill="#e8eeff">buffers</text>
<rect class="f-cyan" x="32" y="254" width="336" height="46" rx="8" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="44" y="274" font-weight="700" fill="#e8eeff">Back end</text>
<text class="f-ink" x="44" y="292" fill="#e8eeff">ECC · flash interface (ONFI / Toggle)</text>
<line class="f-line" x1="80" y1="300" x2="80" y2="344" stroke="#7d86a3" stroke-width="1.5"/>
<line class="f-line" x1="160" y1="300" x2="160" y2="344" stroke="#7d86a3" stroke-width="1.5"/>
<line class="f-line" x1="240" y1="300" x2="240" y2="344" stroke="#7d86a3" stroke-width="1.5"/>
<line class="f-line" x1="320" y1="300" x2="320" y2="344" stroke="#7d86a3" stroke-width="1.5"/>
<text class="f-mute" x="86" y="332" fill="#a3abc4">CH0</text>
<text class="f-mute" x="166" y="332" fill="#a3abc4">CH1</text>
<text class="f-mute" x="246" y="332" fill="#a3abc4">CH2</text>
<text class="f-mute" x="326" y="332" fill="#a3abc4">CH3</text>
<rect class="f-violet" x="50" y="344" width="60" height="28" rx="4" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<rect class="f-violet" x="50" y="378" width="60" height="28" rx="4" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<rect class="f-violet" x="130" y="344" width="60" height="28" rx="4" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<rect class="f-violet" x="130" y="378" width="60" height="28" rx="4" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<rect class="f-violet" x="210" y="344" width="60" height="28" rx="4" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<rect class="f-violet" x="210" y="378" width="60" height="28" rx="4" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<rect class="f-violet" x="290" y="344" width="60" height="28" rx="4" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<rect class="f-violet" x="290" y="378" width="60" height="28" rx="4" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<text class="f-ink" x="80" y="363" text-anchor="middle" fill="#e8eeff">NAND</text>
<text class="f-ink" x="80" y="397" text-anchor="middle" fill="#e8eeff">NAND</text>
<text class="f-ink" x="160" y="363" text-anchor="middle" fill="#e8eeff">NAND</text>
<text class="f-ink" x="160" y="397" text-anchor="middle" fill="#e8eeff">NAND</text>
<text class="f-ink" x="240" y="363" text-anchor="middle" fill="#e8eeff">NAND</text>
<text class="f-ink" x="240" y="397" text-anchor="middle" fill="#e8eeff">NAND</text>
<text class="f-ink" x="320" y="363" text-anchor="middle" fill="#e8eeff">NAND</text>
<text class="f-ink" x="320" y="397" text-anchor="middle" fill="#e8eeff">NAND</text>
<text class="f-mute" x="200" y="428" text-anchor="middle" fill="#a3abc4">flash: 4 channels × 2 dies each</text>
</svg>
