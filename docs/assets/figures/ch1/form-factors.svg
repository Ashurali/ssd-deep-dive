<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>SSD form factors drawn to one scale</title>
<desc>Outlines drawn to the same scale. Top row: a 2.5-inch drive (100 by 70 mm, the shell U.2 drives also use), an EDSFF E3.S drive (76 by 113 mm) and an EDSFF E1.S drive (about 32 by 112 mm). Bottom row: M.2 cards 22 mm wide and 80, 42 or 30 mm long, and a BGA SSD package of 11.5 by 13 mm. Client form factors are cyan, data-center ones violet, and the 2.5-inch shell, used by both, amber.</desc>
<text class="f-mute" x="12" y="18" fill="#a3abc4">All outlines drawn to the same scale</text>
<rect class="f-amber" x="24.0" y="96.4" width="150.7" height="104.8" rx="3" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<text class="f-ink" x="99.4" y="219.1" text-anchor="middle" fill="#e8eeff">2.5″ / U.2</text>
<text class="f-mute" x="99.4" y="235.1" text-anchor="middle" fill="#a3abc4">100 × 70 mm</text>
<rect class="f-violet" x="194.7" y="32.0" width="114.0" height="169.1" rx="3" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<text class="f-ink" x="251.7" y="219.1" text-anchor="middle" fill="#e8eeff">E3.S</text>
<text class="f-mute" x="251.7" y="235.1" text-anchor="middle" fill="#a3abc4">76 × 113 mm</text>
<rect class="f-violet" x="328.7" y="33.9" width="47.2" height="167.2" rx="3" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<text class="f-ink" x="352.3" y="219.1" text-anchor="middle" fill="#e8eeff">E1.S</text>
<text class="f-mute" x="352.3" y="235.1" text-anchor="middle" fill="#a3abc4">≈ 32 × 112</text>
<rect class="f-cyan" x="34.2" y="259.1" width="120.0" height="33.0" rx="3" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="94.2" y="310.1" text-anchor="middle" fill="#e8eeff">M.2 2280</text>
<text class="f-mute" x="94.2" y="326.1" text-anchor="middle" fill="#a3abc4">22 × 80 mm</text>
<rect class="f-cyan" x="182.2" y="259.1" width="63.0" height="33.0" rx="3" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="213.8" y="310.1" text-anchor="middle" fill="#e8eeff">2242</text>
<text class="f-mute" x="213.8" y="326.1" text-anchor="middle" fill="#a3abc4">22 × 42</text>
<rect class="f-cyan" x="273.2" y="259.1" width="45.0" height="33.0" rx="3" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="295.8" y="310.1" text-anchor="middle" fill="#e8eeff">2230</text>
<text class="f-mute" x="295.8" y="326.1" text-anchor="middle" fill="#a3abc4">22 × 30</text>
<rect class="f-cyan" x="346.2" y="274.9" width="19.5" height="17.2" rx="3" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="356.0" y="310.1" text-anchor="middle" fill="#e8eeff">BGA</text>
<text class="f-mute" x="356.0" y="326.1" text-anchor="middle" fill="#a3abc4">11.5 × 13</text>
<rect class="f-cyan" x="24" y="344.125" width="10" height="10" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="40" y="354.125" fill="#e8eeff">client</text>
<rect class="f-violet" x="103.0" y="344.125" width="10" height="10" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<text class="f-ink" x="119.0" y="354.125" fill="#e8eeff">data center</text>
<rect class="f-amber" x="219.5" y="344.125" width="10" height="10" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<text class="f-ink" x="235.5" y="354.125" fill="#e8eeff">both</text>
<path class="f-line" d="M361.0,346.125 v6 H376.0 v-6" fill="none" stroke="#7d86a3" stroke-width="1.5"/>
<text class="f-mute" x="355.0" y="354.125" text-anchor="end" fill="#a3abc4">10 mm</text>
</svg>
