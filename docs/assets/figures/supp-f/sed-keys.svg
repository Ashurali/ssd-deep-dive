<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>The key hierarchy of a self-encrypting drive</title>
<desc>From top to bottom. A password, the user's or administrator's secret, goes through a key derivation function to give the key encryption key, which is derived on demand and never stored. The key encryption key unwraps the media encryption key, whose wrapped copy is stored in flash; the unwrapped key is held only inside the controller. The media encryption key drives the AES-XTS engine, which encrypts every write and decrypts every read, so the NAND flash holds only ciphertext. Crypto erase destroys the media encryption key, and every block becomes noise.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-ink" d="M0,0 L8,4 L0,8 z" fill="#e8eeff"/></marker></defs>
<rect class="f-violet" x="16" y="8" width="234" height="40" rx="8" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<text class="f-ink" x="28" y="25" font-weight="700" fill="#e8eeff">Password</text>
<text class="f-ink" x="28" y="42" fill="#e8eeff">the user's or admin's secret</text>
<line class="f-line" x1="133" y1="50" x2="133" y2="66" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="f-mute" x="141" y="62" fill="#a3abc4">KDF</text>
<rect class="f-amber" x="16" y="68" width="234" height="40" rx="8" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<text class="f-ink" x="28" y="85" font-weight="700" fill="#e8eeff">Key encryption key</text>
<text class="f-ink" x="28" y="102" fill="#e8eeff">derived on demand, never stored</text>
<line class="f-line" x1="133" y1="110" x2="133" y2="126" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="f-mute" x="141" y="122" fill="#a3abc4">unwraps</text>
<rect class="f-amber" x="16" y="128" width="234" height="40" rx="8" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<text class="f-ink" x="28" y="145" font-weight="700" fill="#e8eeff">Media encryption key</text>
<text class="f-ink" x="28" y="162" fill="#e8eeff">held only inside the controller</text>
<rect class="f-cyan" x="266" y="128" width="118" height="40" rx="8" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="278" y="145" font-weight="700" fill="#e8eeff">wrapped key</text>
<text class="f-ink" x="278" y="162" fill="#e8eeff">stored in flash</text>
<line class="f-line" x1="266" y1="148" x2="252" y2="148" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line class="f-line" x1="133" y1="170" x2="133" y2="186" stroke="#7d86a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="f-green" x="16" y="188" width="234" height="40" rx="8" fill="#7ee2a8" fill-opacity=".22" stroke="#7ee2a8" stroke-width="1.5"/>
<text class="f-ink" x="28" y="205" font-weight="700" fill="#e8eeff">AES-XTS engine</text>
<text class="f-ink" x="28" y="222" fill="#e8eeff">encrypts writes, decrypts reads</text>
<line class="f-line" x1="133" y1="232" x2="133" y2="246" stroke="#7d86a3" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect class="f-line" x="16" y="248" width="234" height="40" rx="8" fill="none" stroke="#7d86a3" stroke-width="1.2"/>
<text class="f-ink" x="28" y="265" font-weight="700" fill="#e8eeff">NAND flash</text>
<text class="f-ink" x="28" y="282" fill="#e8eeff">holds only ciphertext</text>
<text class="f-red-t" x="266" y="202" font-weight="700" fill="#ff7b72">crypto erase:</text>
<text class="f-red-t" x="266" y="220" fill="#ff7b72">destroy the key,</text>
<text class="f-red-t" x="266" y="238" fill="#ff7b72">and every block</text>
<text class="f-red-t" x="266" y="256" fill="#ff7b72">becomes noise</text>
</svg>
