<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>A soft read turns strobes into log-likelihood ratios</title>
<desc>Two overlapping threshold-voltage bells: cells storing 1 on the left, cells storing 0 on the right. A dashed hard-read reference sits between them, and the cells of each bell that fall on the wrong side of it are shaded as read wrong. Four more strobes, two on each side of the reference, split the voltage axis into six bins. Below the axis, two rows give the log-likelihood ratio, the LLR, that each read assigns. The hard read alone gives every cell minus 4 or plus 4. The five strobes give, from left to right, minus 8, minus 4, minus 1, plus 1, plus 4 and plus 8: the cells near the reference, where the misread cells sit, get small values that tell the decoder they are unsure.</desc>
