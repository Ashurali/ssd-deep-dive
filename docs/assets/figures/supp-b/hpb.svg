<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 222" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>What HPB removes from a random read</title>
<desc>Two timelines of one random read, not to scale. Without HPB, on a miss in the device's small map cache: the command crosses the link, the device reads the map page from flash, then reads the data from flash, then sends the data back, so the read costs two flash reads. With HPB: the host first looks up the physical address in its own cached copy of the map, in host DRAM, and sends it with the command; the device reads the data from flash once and sends it back. The read finishes one flash read sooner.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-ink" d="M0,0 L8,4 L0,8 z" fill="#e8eeff"/></marker></defs>
<text x="16" y="18"><tspan class="f-ink" font-weight="700" fill="#e8eeff">Without HPB</tspan><tspan class="f-mute" fill="#a3abc4"> · map-cache miss: two flash reads</tspan></text>
<rect class="f-line" x="16" y="28" width="18" height="26" fill="none" stroke="#7d86a3" stroke-width="1.2"/>
<rect class="f-amber" x="38" y="28" width="120" height="26" rx="3" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<text class="f-ink" x="98" y="46" text-anchor="middle" fill="#e8eeff">flash read: map</text>
<rect class="f-cyan" x="162" y="28" width="120" height="26" rx="3" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="222" y="46" text-anchor="middle" fill="#e8eeff">flash read: data</text>
<rect class="f-line" x="286" y="28" width="32" height="26" fill="none" stroke="#7d86a3" stroke-width="1.2"/>
<text x="16" y="84"><tspan class="f-ink" font-weight="700" fill="#e8eeff">With HPB</tspan><tspan class="f-mute" fill="#a3abc4"> · the host sends the address</tspan></text>
<rect class="f-green" x="16" y="94" width="8" height="26" fill="#7ee2a8" fill-opacity=".22" stroke="#7ee2a8" stroke-width="1.5"/>
<rect class="f-line" x="28" y="94" width="18" height="26" fill="none" stroke="#7d86a3" stroke-width="1.2"/>
<rect class="f-cyan" x="50" y="94" width="120" height="26" rx="3" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="110" y="112" text-anchor="middle" fill="#e8eeff">flash read: data</text>
<rect class="f-line" x="174" y="94" width="32" height="26" fill="none" stroke="#7d86a3" stroke-width="1.2"/>
<line class="f-green-l f-dash" x1="318" y1="56" x2="318" y2="146" stroke="#7ee2a8" stroke-width="1.5" stroke-dasharray="4 3"/>
<line class="f-green-l f-dash" x1="206" y1="122" x2="206" y2="146" stroke="#7ee2a8" stroke-width="1.5" stroke-dasharray="4 3"/>
<line class="f-line" x1="208" y1="140" x2="316" y2="140" stroke="#7d86a3" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="f-green-t" x="262" y="162" text-anchor="middle" fill="#7ee2a8">one flash read saved</text>
<rect class="f-green" x="16" y="182" width="12" height="12" fill="#7ee2a8" fill-opacity=".22" stroke="#7ee2a8" stroke-width="1.5"/>
<text class="f-mute" x="34" y="192" fill="#a3abc4">host's map lookup, in its DRAM</text>
<rect class="f-line" x="248" y="182" width="12" height="12" fill="none" stroke="#7d86a3" stroke-width="1.2"/>
<text class="f-mute" x="266" y="192" fill="#a3abc4">link transfer</text>
<text class="f-mute" x="16" y="214" fill="#a3abc4">not to scale</text>
<text class="f-mute" x="384" y="214" text-anchor="end" fill="#a3abc4">time →</text>
</svg>
