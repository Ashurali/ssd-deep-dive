<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 244" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>Link states: power saved against time to wake</title>
<desc>A mirrored bar chart of the PCIe link states L0, L0s, L1, L1.1, L1.2 and L2, from left to right, not to scale. Above the axis, the power each state draws while idle shrinks from left to right. Below the axis, the time each state takes to wake grows from left to right: none for L0, then nanoseconds for L0s, microseconds for L1 and L1.1, tens of microseconds for L1.2, and milliseconds for L2, whose link must be retrained.</desc>
<rect class="f-cyan" x="16" y="7" width="12" height="12" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-mute" x="34" y="18" fill="#a3abc4">power while idle</text>
<rect class="f-amber" x="200" y="7" width="12" height="12" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<text class="f-mute" x="218" y="18" fill="#a3abc4">time to wake</text>
<text class="f-mute" x="384" y="40" text-anchor="end" fill="#a3abc4">not to scale</text>
<g class="f-cyan" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5">
<rect x="46" y="40" width="36" height="90"/>
<rect x="106" y="70" width="36" height="60"/>
<rect x="166" y="96" width="36" height="34"/>
<rect x="226" y="108" width="36" height="22"/>
<rect x="286" y="120" width="36" height="10"/>
<rect x="346" y="126" width="36" height="4"/>
</g>
<g class="f-amber" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5">
<rect x="106" y="130" width="36" height="6"/>
<rect x="166" y="130" width="36" height="22"/>
<rect x="226" y="130" width="36" height="30"/>
<rect x="286" y="130" width="36" height="48"/>
<rect x="346" y="130" width="36" height="80"/>
</g>
<line class="f-line" x1="30" y1="130" x2="392" y2="130" stroke="#7d86a3" stroke-width="1.2"/>
<text class="f-mute" x="64" y="150" text-anchor="middle" fill="#a3abc4">none</text>
<g class="f-ink" fill="#e8eeff" text-anchor="middle" font-weight="700">
<text x="64" y="236">L0</text>
<text x="124" y="236">L0s</text>
<text x="184" y="236">L1</text>
<text x="244" y="236">L1.1</text>
<text x="304" y="236">L1.2</text>
<text x="364" y="236">L2</text>
</g>
</svg>
