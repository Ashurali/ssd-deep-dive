<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 404" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>Threshold-voltage distributions for SLC, MLC and TLC</title>
<desc>Three panels share one threshold-voltage axis. SLC: two bell curves, erased (1) and programmed (0), far apart, with one read reference at 0 V inside a wide margin. MLC: four bells, E and P1 to P3, with three read references. TLC: eight narrow bells, E and P1 to P7, with seven read references; the margins between neighbours are thin slivers.</desc>
