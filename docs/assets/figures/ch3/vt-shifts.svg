<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>How retention, read disturb and wear move the bells</title>
<desc>Four panels, each with an erased bell (E), a programmed bell (P) and a dashed read reference between them. Fresh: the bells are far apart. Retention: the P bell slides left toward the reference, and the cells that cross it read wrong; a Read Retry reference placed in the new gap reads them all correctly again. Read disturb: the E bell slides right and its tail crosses the reference. Wear: both bells widen until their tails overlap, so some cells read wrong wherever the reference sits, and only ECC can fix them. Dashed outlines show where each moved bell began.</desc>
<text x="12" y="24" font-size="14"><tspan class="f-ink" fill="#e8eeff" font-weight="700">Fresh</tspan><tspan class="f-mute" fill="#a3abc4"> · bells well apart</tspan></text>
