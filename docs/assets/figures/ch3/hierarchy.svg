<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>The NAND hierarchy: die, planes, blocks, wordlines and pages</title>
<desc>Top: one die, the unit that executes a flash command. It holds two planes. Each plane holds many blocks and has its own page register and cache register, each one page in size; data moves between the array and the page register, and between the cache register and the controller. Bottom: one block enlarged. Wordlines run across and bitlines run down; a cell sits at each crossing. All the cells along one wordline form one page in SLC flash, or three pages in TLC. The block's cells share one substrate, which is why a block is the unit of erase.</desc>
<rect class="f-line" x="8" y="8" width="384" height="226" rx="10" fill="none" stroke="#7d86a3"/>
<text class="f-ink" x="20" y="28" font-weight="700" fill="#e8eeff">die (LUN)</text>
<text class="f-mute" x="380" y="28" text-anchor="end" fill="#a3abc4">executes one command</text>
<rect class="f-line f-panel" x="20" y="40" width="176" height="184" rx="8" fill="#111832" stroke="#7d86a3"/>
<rect class="f-line f-panel" x="204" y="40" width="176" height="184" rx="8" fill="#111832" stroke="#7d86a3"/>
<text class="f-ink" x="108" y="58" text-anchor="middle" font-weight="700" fill="#e8eeff">plane 0</text>
<text class="f-ink" x="292" y="58" text-anchor="middle" font-weight="700" fill="#e8eeff">plane 1</text>
<rect class="f-violet" x="32" y="66" width="152" height="20" rx="3" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<rect class="f-cyan" x="32" y="90" width="152" height="20" rx="3" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<rect class="f-violet" x="32" y="114" width="152" height="20" rx="3" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<rect class="f-violet" x="216" y="66" width="152" height="20" rx="3" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<rect class="f-violet" x="216" y="90" width="152" height="20" rx="3" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<rect class="f-violet" x="216" y="114" width="152" height="20" rx="3" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<text class="f-ink" x="108" y="81" text-anchor="middle" fill="#e8eeff">block 0</text>
<text class="f-ink" x="108" y="105" text-anchor="middle" fill="#e8eeff">block 1</text>
<text class="f-ink" x="108" y="129" text-anchor="middle" fill="#e8eeff">block 2</text>
<text class="f-ink" x="292" y="81" text-anchor="middle" fill="#e8eeff">block 0</text>
<text class="f-ink" x="292" y="105" text-anchor="middle" fill="#e8eeff">block 1</text>
<text class="f-ink" x="292" y="129" text-anchor="middle" fill="#e8eeff">block 2</text>
<text class="f-mute" x="108" y="150" text-anchor="middle" fill="#a3abc4">… more blocks</text>
<text class="f-mute" x="292" y="150" text-anchor="middle" fill="#a3abc4">… more blocks</text>
<rect class="f-amber" x="32" y="160" width="152" height="24" rx="3" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<rect class="f-amber" x="216" y="160" width="152" height="24" rx="3" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<text class="f-ink" x="108" y="177" text-anchor="middle" fill="#e8eeff">page register</text>
<text class="f-ink" x="292" y="177" text-anchor="middle" fill="#e8eeff">page register</text>
<rect class="f-green" x="32" y="190" width="152" height="24" rx="3" fill="#7ee2a8" fill-opacity=".22" stroke="#7ee2a8" stroke-width="1.5"/>
<rect class="f-green" x="216" y="190" width="152" height="24" rx="3" fill="#7ee2a8" fill-opacity=".22" stroke="#7ee2a8" stroke-width="1.5"/>
<text class="f-ink" x="108" y="207" text-anchor="middle" fill="#e8eeff">cache register</text>
<text class="f-ink" x="292" y="207" text-anchor="middle" fill="#e8eeff">cache register</text>
<text class="f-ink" x="20" y="262" font-weight="700" fill="#e8eeff">Block 1, enlarged</text>
<text class="f-mute" x="380" y="262" text-anchor="end" fill="#a3abc4">the unit of erase</text>
<rect class="f-cyan-b" x="64" y="270" width="272" height="118" rx="6" fill="#4dd0c4" fill-opacity=".12"/>
<path class="f-line" d="M100,282 V378 M140,282 V378 M180,282 V378 M220,282 V378 M260,282 V378 M300,282 V378" fill="none" stroke="#7d86a3" stroke-width="1.2"/>
<path class="f-line" d="M84,296 H316 M84,344 H316 M84,368 H316" fill="none" stroke="#7d86a3" stroke-width="1.2"/>
<line class="f-cyan-l" x1="84" y1="320" x2="316" y2="320" stroke="#4dd0c4" stroke-width="3"/>
<text class="f-mute" x="20" y="300" fill="#a3abc4">WL0</text>
<text class="f-cyan-t" x="20" y="324" font-weight="700" fill="#4dd0c4">WL1</text>
<text class="f-mute" x="20" y="348" fill="#a3abc4">WL2</text>
<text class="f-mute" x="20" y="372" fill="#a3abc4">WL3</text>
<g class="f-line f-panel" fill="#111832" stroke="#7d86a3"><rect x="95" y="291" width="10" height="10"/><rect x="135" y="291" width="10" height="10"/><rect x="175" y="291" width="10" height="10"/><rect x="215" y="291" width="10" height="10"/><rect x="255" y="291" width="10" height="10"/><rect x="295" y="291" width="10" height="10"/><rect x="95" y="339" width="10" height="10"/><rect x="135" y="339" width="10" height="10"/><rect x="175" y="339" width="10" height="10"/><rect x="215" y="339" width="10" height="10"/><rect x="255" y="339" width="10" height="10"/><rect x="295" y="339" width="10" height="10"/><rect x="95" y="363" width="10" height="10"/><rect x="135" y="363" width="10" height="10"/><rect x="175" y="363" width="10" height="10"/><rect x="215" y="363" width="10" height="10"/><rect x="255" y="363" width="10" height="10"/><rect x="295" y="363" width="10" height="10"/></g>
<g class="f-cyan" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"><rect x="95" y="315" width="10" height="10"/><rect x="135" y="315" width="10" height="10"/><rect x="175" y="315" width="10" height="10"/><rect x="215" y="315" width="10" height="10"/><rect x="255" y="315" width="10" height="10"/><rect x="295" y="315" width="10" height="10"/></g>
<text class="f-mute" x="344" y="300" fill="#a3abc4">cells</text>
<text class="f-cyan-t" x="344" y="324" fill="#4dd0c4">page</text>
<text class="f-mute" x="200" y="404" text-anchor="middle" fill="#a3abc4">bitlines run down · wordlines run across</text>
<text class="f-cyan-t" x="200" y="422" text-anchor="middle" fill="#4dd0c4">one wordline = 1 page (SLC), 3 pages (TLC)</text>
</svg>
