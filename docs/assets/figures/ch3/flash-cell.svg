<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 366" font-family="IBM Plex Sans, sans-serif" font-size="13">
<title>A floating-gate cell and a charge-trap cell</title>
<desc>Two cross-sections of a flash cell, one above the other. Each is a transistor: a control gate on top, a blocking oxide, a charge-storage layer, a thin tunnel oxide, and the silicon substrate with a source, a drain and the channel between them. Top: in a floating-gate cell the storage layer is a conductor, and its stored electrons spread through it, so one weak spot in the tunnel oxide can drain them all. Bottom: in a charge-trap cell the storage layer is insulating silicon nitride, and each electron stays in the trap that caught it, so a weak spot only loses the charge right above it.</desc>
<defs><marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-red-t" d="M0,0 L8,4 L0,8 z" fill="#ff7b72"/></marker></defs>
<text class="f-ink" x="16" y="20" font-weight="700" fill="#e8eeff">Floating gate</text>
<text class="f-red-t" x="384" y="20" text-anchor="end" fill="#ff7b72">one weak spot drains it all</text>
<rect class="f-cyan" x="110" y="32" width="180" height="26" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="200" y="50" text-anchor="middle" fill="#e8eeff">control gate</text>
<rect class="f-line f-panel" x="110" y="58" width="180" height="16" fill="#111832" stroke="#7d86a3"/>
<text class="f-mute" x="200" y="70" text-anchor="middle" fill="#a3abc4">blocking oxide</text>
<rect class="f-amber" x="110" y="74" width="180" height="30" fill="#f2b13c" fill-opacity=".22" stroke="#f2b13c" stroke-width="1.5"/>
<text class="f-ink" x="200" y="88" text-anchor="middle" fill="#e8eeff">floating gate (conductor)</text>
<g class="f-ink" fill="#e8eeff"><circle cx="124" cy="98" r="2.6"/><circle cx="146" cy="98" r="2.6"/><circle cx="168" cy="98" r="2.6"/><circle cx="190" cy="98" r="2.6"/><circle cx="212" cy="98" r="2.6"/><circle cx="234" cy="98" r="2.6"/><circle cx="256" cy="98" r="2.6"/><circle cx="278" cy="98" r="2.6"/></g>
<rect class="f-line f-panel" x="110" y="104" width="180" height="16" fill="#111832" stroke="#7d86a3"/>
<text class="f-mute" x="186" y="116" text-anchor="middle" fill="#a3abc4">tunnel oxide</text>
<rect class="f-line f-panel" x="40" y="120" width="320" height="50" fill="#111832" stroke="#7d86a3"/>
<rect class="f-violet" x="40" y="120" width="70" height="20" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<rect class="f-violet" x="290" y="120" width="70" height="20" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<text class="f-ink" x="75" y="135" text-anchor="middle" fill="#e8eeff">source</text>
<text class="f-ink" x="325" y="135" text-anchor="middle" fill="#e8eeff">drain</text>
<text class="f-mute" x="186" y="135" text-anchor="middle" fill="#a3abc4">channel</text>
<text class="f-mute" x="200" y="160" text-anchor="middle" fill="#a3abc4">p-type substrate</text>
<circle class="f-red-t" cx="262" cy="112" r="3.5" fill="#ff7b72"/>
<line class="f-red-l" x1="262" y1="101" x2="262" y2="134" stroke="#ff7b72" stroke-width="2" marker-end="url(#arrow-red)"/>
<line class="f-faint" x1="16" y1="182" x2="384" y2="182" stroke="#2a3150"/>
<text class="f-ink" x="16" y="206" font-weight="700" fill="#e8eeff">Charge trap</text>
<text class="f-green-t" x="384" y="206" text-anchor="end" fill="#7ee2a8">only nearby charge escapes</text>
<rect class="f-cyan" x="110" y="218" width="180" height="26" fill="#4dd0c4" fill-opacity=".22" stroke="#4dd0c4" stroke-width="1.5"/>
<text class="f-ink" x="200" y="236" text-anchor="middle" fill="#e8eeff">control gate</text>
<rect class="f-line f-panel" x="110" y="244" width="180" height="16" fill="#111832" stroke="#7d86a3"/>
<text class="f-mute" x="200" y="256" text-anchor="middle" fill="#a3abc4">blocking oxide</text>
<rect class="f-green" x="110" y="260" width="180" height="30" fill="#7ee2a8" fill-opacity=".22" stroke="#7ee2a8" stroke-width="1.5"/>
<text class="f-ink" x="200" y="274" text-anchor="middle" fill="#e8eeff">silicon nitride (traps)</text>
<g class="f-ink" fill="#e8eeff"><circle cx="128" cy="283" r="2.6"/><circle cx="153" cy="286" r="2.6"/><circle cx="176" cy="282" r="2.6"/><circle cx="211" cy="285" r="2.6"/><circle cx="236" cy="282" r="2.6"/><circle cx="262" cy="285" r="2.6"/><circle cx="279" cy="283" r="2.6"/></g>
<rect class="f-line f-panel" x="110" y="290" width="180" height="16" fill="#111832" stroke="#7d86a3"/>
<text class="f-mute" x="186" y="302" text-anchor="middle" fill="#a3abc4">tunnel oxide</text>
<rect class="f-line f-panel" x="40" y="306" width="320" height="50" fill="#111832" stroke="#7d86a3"/>
<rect class="f-violet" x="40" y="306" width="70" height="20" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<rect class="f-violet" x="290" y="306" width="70" height="20" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
<text class="f-ink" x="75" y="321" text-anchor="middle" fill="#e8eeff">source</text>
<text class="f-ink" x="325" y="321" text-anchor="middle" fill="#e8eeff">drain</text>
<text class="f-mute" x="186" y="321" text-anchor="middle" fill="#a3abc4">channel</text>
<text class="f-mute" x="200" y="346" text-anchor="middle" fill="#a3abc4">p-type substrate</text>
<circle class="f-red-t" cx="262" cy="298" r="3.5" fill="#ff7b72"/>
<line class="f-red-l" x1="262" y1="289" x2="262" y2="320" stroke="#ff7b72" stroke-width="2" marker-end="url(#arrow-red)"/>
</svg>
